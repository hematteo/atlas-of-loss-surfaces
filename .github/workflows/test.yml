name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  plates:
    # Open the atlas in headless Chromium and visit all forty plates (tests/smoke.mjs).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
